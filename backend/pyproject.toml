[project]
name = "flowtask-backend"
version = "1.0.0"
description = "API REST de FlowTask: gestión de tareas por categorías."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
]
ignore = ["B008"] # Depends()/Query() en firmas es el patrón idiomático de FastAPI

[tool.ruff.lint.isort]
# La carpeta local alembic/ (migraciones) hace que ruff lo tome como first-party.
known-third-party = ["alembic"]
